; PlatformIO Project Configuration File
;
; CubeMX reference: ../cubemaxexample/cubemaxexample.ioc
; - STM32F407VGT6, HSE 8 MHz
; - SYSCLK 168 MHz via PLL: M=8, N=336, P=2, Q=7
; - SWD kept on PA13/PA14

[env:genericSTM32F407VGT6]
platform = ststm32
board = genericSTM32F407VGT6
framework = stm32cube
board_build.f_cpu = 168000000L
build_flags =
    -DSTM32F407xx
    -DUSE_HAL_DRIVER
    -DHSE_VALUE=8000000U
    -DHSI_VALUE=16000000U

; Use an ST-Link probe through SWD.
; Wiring: STLINK 3V3/VTref -> board 3V3, GND -> GND, SWDIO -> PA13, SWCLK -> PA14.
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200
monitor_port = COM11
